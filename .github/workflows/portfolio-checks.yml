name: Portfolio checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/interactive-chaos-triangle]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: CI=true npm test -- --watch=false
      - name: Build portfolio
        run: npm run build
